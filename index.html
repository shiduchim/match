<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315b78"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>PeerMatch</title><style>:root{--bg:#f6f5f2;--card:#fff;--text:#19324a;--muted:#73818b;--line:#e0dfdc;--accent:#315b78;--soft:#eaf1f6;--green:#eaf5ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:78px}header{padding:16px;position:sticky;top:0;background:rgba(246,245,242,.96);z-index:5}.brand{font-size:29px;font-weight:800}.sub{font-size:13px;color:var(--muted)}main{padding:8px 15px 30px}h1{font-size:27px;margin:10px 0 14px}h2{margin:0 0 14px}.toolbar,.row,.actions{display:flex;gap:9px}.toolbar input{flex:1}input,textarea{width:100%;border:1px solid #d6d7d4;background:#fff;border-radius:14px;padding:13px 14px;font:inherit;color:var(--text)}textarea{min-height:165px;resize:vertical}button{border:0;border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--text)}.green{background:var(--green);color:#245f37}.full{width:100%}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.cardRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.left{display:flex;align-items:center;gap:12px;min-width:0}.avatar,.photo{width:52px;height:52px;border-radius:14px;background:#edf0f1;display:grid;place-items:center;object-fit:cover;flex:0 0 auto}.name{font-weight:800}.small{font-size:13px;color:var(--muted);margin-top:3px}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:38px 15px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;z-index:50}.sheet{width:min(620px,100%);max-height:93vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px}.gap{height:10px}.sectionTitle{font-size:14px;font-weight:800;margin:18px 0 8px}.event{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin:8px 0}.eventTop{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}.profileText{white-space:pre-wrap;line-height:1.45}.banner{background:#eaf5ec;border:1px solid #cfe5d5;border-radius:15px;padding:12px;margin-bottom:12px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}nav button{border-radius:0;background:#fff;color:#6f7b84}nav button.active{background:#f7fafc;color:var(--accent)}label{display:block;font-size:13px;color:var(--muted);margin:12px 0}.actions{display:grid;grid-template-columns:1fr 1fr}audio{width:100%;margin-top:6px}</style></head><body><div class="app"><header><div class="brand">PeerMatch</div><div class="sub">Private shidduch contact & profile tracker</div></header><main><div id="banner" class="banner hidden">A shared profile is ready to import.</div><section id="shadchanimSection"><h1>Shadchanim</h1><div class="toolbar"><input id="shadchanSearch" placeholder="Search shadchanim"><button id="addShadchan" class="primary">Add</button></div><div id="shadchanList"></div></section><section id="guysSection" class="hidden"><h1>Guys</h1><div class="toolbar"><input id="guysSearch" placeholder="Search guys"><button id="addGuy" class="primary">Add</button></div><div id="guysList"></div></section><section id="girlsSection" class="hidden"><h1>Girls</h1><div class="toolbar"><input id="girlsSearch" placeholder="Search girls"><button id="addGirl" class="primary">Add</button></div><div id="girlsList"></div></section></main><nav><button id="tabShadchanim" class="active">Shadchanim</button><button id="tabGuys">Guys</button><button id="tabGirls">Girls</button></nav></div><div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div><script>const $=id=>document.getElementById(id);let data={shadchanim:[],guys:[],girls:[]},rec=null,stream=null,chunks=[];function db(){return new Promise((ok,no)=>{const r=indexedDB.open('PeerMatchDB',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('inbox'))d.createObjectStore('inbox')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function get(store,key){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(store,'readonly'),r=t.objectStore(store).get(key);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(store,key,val){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).put(val,key);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function del(store,key){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=ok;t.onerror=()=>no(t.error)})}const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const stamp=()=>new Date().toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});const save=()=>put('kv','state',data);function show(k){['shadchanim','guys','girls'].forEach(x=>{$(x+'Section').classList.toggle('hidden',x!==k);$('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===k)})}function open(html){$('sheet').innerHTML=html;$('modal').classList.remove('hidden')}function close(){if(rec&&rec.state==='recording')rec.stop();$('modal').classList.add('hidden');$('sheet').innerHTML=''}function url(b){return b?URL.createObjectURL(b):''}function last(x){if(!x.activities?.length)return'No notes yet';let a=x.activities[x.activities.length-1];return(a.type==='audio'?'Audio note':a.text)+' • '+a.ts}function acts(x){return x.activities?.length?[...x.activities].reverse().map(a=>`<div class="event"><div class="eventTop"><span>${a.type==='audio'?'Audio note':esc(a.type==='action'?a.action:'Text note')}</span><span>${esc(a.ts)}</span></div>${a.type==='audio'?`<audio controls src="${url(a.audio)}"></audio>`:`<div class="profileText">${esc(a.text)}</div>`}</div>`).join(''):'<div class="empty">No notes yet.</div>'}function renderS(){let q=$('shadchanSearch').value.toLowerCase(),b=$('shadchanList');let a=data.shadchanim.filter(x=>(x.name+' '+x.phone+' '+x.email+' '+x.tags+' '+(x.activities||[]).map(n=>n.text||'').join(' ')).toLowerCase().includes(q));b.innerHTML=a.length?'':'<div class="empty">No shadchanim yet.</div>';a.forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="cardRow"><div class="left"><div class="avatar">${esc(x.name.split(/\s+/).map(z=>z[0]).join('').slice(0,2).toUpperCase())}</div><div><div class="name">${esc(x.name)}</div><div class="small">${esc(last(x).slice(0,95))}</div></div></div><div>›</div></div>`;d.onclick=()=>openS(x.id);b.appendChild(d)})}function renderP(k){let q=$(k+'Search').value.toLowerCase(),b=$(k+'List');let a=data[k].filter(x=>(x.name+' '+x.text+' '+x.source+' '+(x.activities||[]).map(n=>n.text||'').join(' ')).toLowerCase().includes(q));b.innerHTML=a.length?'':`<div class="empty">No ${k} added yet.</div>`;a.forEach(x=>{let d=document.createElement('div');d.className='card',im=x.photo?`<img class="photo" src="${url(x.photo)}">`:'<div class="photo">Photo</div>';d.innerHTML=`<div class="cardRow"><div class="left">${im}<div><div class="name">${esc(x.name)}</div><div class="small">${esc(x.source?'From '+x.source:'Shidduch profile')}</div><div class="small">${esc(last(x).slice(0,85))}</div></div></div><div>›</div></div>`;d.onclick=()=>openP(k,x.id);b.appendChild(d)})}function render(){renderS();renderP('guys');renderP('girls')}function addS(){open(`<h2>Add Shadchan</h2><label>Name<input id="sn"></label><label>Phone<input id="sp" type="tel"></label><label>Email<input id="se" type="email"></label><label>Tags<input id="st" placeholder="Chabad, 35+, Israel"></label><button id="ss" class="primary full">Save</button><div class="gap"></div><button id="sc" class="secondary full">Cancel</button>`);$('ss').onclick=async()=>{let n=$('sn').value.trim();if(!n)return alert('Enter a name.');data.shadchanim.unshift({id:Date.now(),name:n,phone:$('sp').value.trim(),email:$('se').value.trim(),tags:$('st').value.trim(),activities:[]});await save();close();renderS()};$('sc').onclick=close}async function launch(x,a,u){x.activities.push({id:Date.now(),type:'action',action:a,text:a+' opened',ts:stamp()});await save();location.href=u}function openS(id){let x=data.shadchanim.find(z=>z.id===id),digits=(x.phone||'').replace(/\D/g,'');open(`<h2>${esc(x.name)}</h2><div class="actions"><button id="call" class="primary">Call</button><button id="sms" class="secondary">SMS</button><button id="wa" class="green">WhatsApp</button><button id="em" class="secondary">Email</button></div><div class="sectionTitle">Conversation / contact history</div>${acts(x)}<button id="tn" class="secondary full">Add text note</button><div class="gap"></div><button id="an" class="secondary full">Record audio note</button><div class="gap"></div><button id="cl" class="secondary full">Close</button>`);$('call').onclick=()=>x.phone?launch(x,'Call','tel:'+x.phone):alert('Add a phone number first.');$('sms').onclick=()=>x.phone?launch(x,'SMS','sms:'+x.phone):alert('Add a phone number first.');$('wa').onclick=()=>digits?launch(x,'WhatsApp','https://wa.me/'+digits):alert('Add a phone number first.');$('em').onclick=()=>x.email?launch(x,'Email','mailto:'+encodeURIComponent(x.email)):alert('Add an email first.');$('tn').onclick=()=>note('shadchanim',id);$('an').onclick=()=>audio('shadchanim',id);$('cl').onclick=close}function addP(k,shared){let s=k==='guys'?'Guy':'Girl',txt=shared?.text||'';open(`<h2>Add ${s}</h2><label>Paste the whole shidduch profile<textarea id="pt">${esc(txt)}</textarea></label><label>Photo (optional)<input id="pp" type="file" accept="image/*"></label><label>Who sent/told you?<input id="ps"></label><button id="pv" class="primary full">Save ${s}</button><div class="gap"></div><button id="pc" class="secondary full">Cancel</button>`);$('pv').onclick=async()=>{let t=$('pt').value.trim();if(!t)return alert('Enter some profile information.');let photo=$('pp').files?.[0]||shared?.photo||null;let name=(t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)[0]||s).slice(0,70);data[k].unshift({id:Date.now(),name,text:t,photo,source:$('ps').value.trim(),activities:[]});await save();await del('inbox','pending');close();renderP(k);show(k)};$('pc').onclick=close}function openP(k,id){let x=data[k].find(z=>z.id===id),im=x.photo?`<img style="width:140px;height:140px;border-radius:18px;object-fit:cover" src="${url(x.photo)}">`:'';open(`<h2>${esc(x.name)}</h2>${im}<div class="card"><div class="profileText">${esc(x.text)}</div></div><div class="sectionTitle">What I did to help / notes</div>${acts(x)}<button id="pn" class="secondary full">Add text note</button><div class="gap"></div><button id="pa" class="secondary full">Record audio note</button><div class="gap"></div><button id="px" class="secondary full">Close</button>`);$('pn').onclick=()=>note(k,id);$('pa').onclick=()=>audio(k,id);$('px').onclick=close}function item(k,id){return data[k].find(x=>x.id===id)}function note(k,id){let x=item(k,id);open(`<h2>Add note</h2><textarea id="nt" placeholder="Write or paste a note..."></textarea><div class="gap"></div><button id="ns" class="primary full">Save Note</button><div class="gap"></div><button id="nc" class="secondary full">Cancel</button>`);$('ns').onclick=async()=>{let t=$('nt').value.trim();if(!t)return;x.activities.push({id:Date.now(),type:'text',text:t,ts:stamp()});await save();k==='shadchanim'?openS(id):openP(k,id);render()};$('nc').onclick=()=>k==='shadchanim'?openS(id):openP(k,id)}async function audio(k,id){let x=item(k,id);try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());x.activities.push({id:Date.now(),type:'audio',audio:new Blob(chunks,{type:rec.mimeType||'audio/webm'}),ts:stamp()});rec=null;await save();k==='shadchanim'?openS(id):openP(k,id);render()};rec.start();let b=k==='shadchanim'?$('an'):$('pa');b.textContent='Recording… tap to stop';b.onclick=()=>rec?.stop()}catch(e){alert('Microphone permission is required.')}}async function incoming(){let x=await get('inbox','pending');if(!x)return;$('banner').classList.remove('hidden');let photo=x.files?.find(f=>f.type?.startsWith('image/'))||null,text=[x.title,x.text,x.url].filter(Boolean).join('\n').trim();open(`<h2>Import Shared Profile</h2><div class="card"><div class="profileText">${esc(text||'Shared item received')}</div></div><div class="actions"><button id="ig" class="primary">Guy</button><button id="il" class="primary">Girl</button></div><div class="gap"></div><button id="ii" class="secondary full">Later</button>`);$('ig').onclick=()=>addP('guys',{text,photo});$('il').onclick=()=>addP('girls',{text,photo});$('ii').onclick=close}$('tabShadchanim').onclick=()=>show('shadchanim');$('tabGuys').onclick=()=>show('guys');$('tabGirls').onclick=()=>show('girls');$('addShadchan').onclick=addS;$('addGuy').onclick=()=>addP('guys');$('addGirl').onclick=()=>addP('girls');$('shadchanSearch').oninput=renderS;$('guysSearch').oninput=()=>renderP('guys');$('girlsSearch').oninput=()=>renderP('girls');$('modal').onclick=e=>{if(e.target===$('modal'))close()};(async()=>{if('serviceWorker'in navigator)try{await navigator.serviceWorker.register('./sw.js')}catch(e){}data=await get('kv','state')||data;['shadchanim','guys','girls'].forEach(k=>{if(!Array.isArray(data[k]))data[k]=[];data[k].forEach(x=>{if(!Array.isArray(x.activities))x.activities=[]})});render();incoming()})();</script></body></html>
