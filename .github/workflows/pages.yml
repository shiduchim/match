name: Deploy PeerMatch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build current PeerMatch runtime
        shell: python
        run: |
          from pathlib import Path
          import ast
          import re
          import shutil

          root = Path('.')
          site = Path('_site')
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()

          sw_text = (root / 'sw.js').read_text(encoding='utf-8')
          version_match = re.search(r"const VERSION='([^']+)'", sw_text)
          scripts_match = re.search(r"const SCRIPTS=\[(.*?)\]\s*;", sw_text, re.S)
          if not version_match or not scripts_match:
              raise RuntimeError('Could not read VERSION/SCRIPTS from sw.js')

          version = version_match.group(1)
          scripts = ast.literal_eval('[' + scripts_match.group(1) + ']')
          required = ['index.html', 'manifest.webmanifest', 'icon.svg', 'sw.js', *scripts]

          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise RuntimeError('Missing live runtime files: ' + ', '.join(missing))

          for name in required:
              shutil.copy2(root / name, site / name)

          index = site / 'index.html'
          html = index.read_text(encoding='utf-8')
          tags = ''.join(f'<script src="./{name}?v={version}"></script>' for name in scripts)
          for name in scripts:
              html = re.sub(
                  rf'<script\s+src=["\']\./{re.escape(name)}(?:\?[^"\']*)?["\']\s*>\s*</script>',
                  '',
                  html,
                  flags=re.I,
              )
          html = html.replace('</body>', tags + '</body>')
          index.write_text(html, encoding='utf-8')

          print(f'PeerMatch v{version}: deploying {len(required)} live web files')

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
