name: Deploy PeerMatch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build first-load PeerMatch page
        shell: python
        run: |
          from pathlib import Path
          import shutil

          root = Path('.')
          site = Path('_site')
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()

          for item in root.iterdir():
              if item.name in {'.git', '.github', '_site'}:
                  continue
              dest = site / item.name
              if item.is_dir():
                  shutil.copytree(item, dest)
              else:
                  shutil.copy2(item, dest)

          index = site / 'index.html'
          html = index.read_text(encoding='utf-8')
          scripts = [
              'whatsapp-enhance.js',
              'peermatch-v11.js',
              'ui-v18.js',
              'peermatch-v19.js',
              'audio-v24.js',
              'send-match-v27.js',
              'make-match-v32.js',
              'match-text-required-v33.js',
              'match-photo-option-v34.js',
              'make-match-v35-ui.js',
              'backup-v28.js',
              'history-delete-v30.js',
              'history-composer-v36.js',
              'sender-fields-v39.js',
              'profile-contact-v40.js',
              'profile-required-v44.js',
              'feature-request-v46.js',
              'profile-display-v48.js',
              'email-photo-v51.js',
              'profile-share-v52.js',
              'shadchan-share-v55.js',
              'selection-layout-v54.js',
              'contact-actions-v56.js',
              'make-match-v60-ui.js',
              'whatsapp-import-v61.js',
              'profile-tools-v62.js',
              'profile-pdf-ocr-v63.js',
              'phone-links-v64.js',
              'ux-v65.js',
              'ux-v65-fix.js',
              'forms-v65.js',
              'link-recovery-v65.js',
              'translate-v65.js',
              'make-match-v65-fix.js',
              'waiting-v65.js',
              'attachment-v66.js',
          ]
          tags = ''.join(f'<script src="./{name}?v=66"></script>' for name in scripts)
          if 'attachment-v66.js?v=66' not in html:
              html = html.replace('</body>', tags + '</body>')
          index.write_text(html, encoding='utf-8')

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
